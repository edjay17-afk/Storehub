[build]
  publish = "netlify-public"

# Replace the .invalid host with your assigned ngrok HTTPS hostname before deploying.
[[redirects]]
  from = "/*"
  to = "https://replace-with-ngrok-host.invalid/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"
  headers = { ngrok-skip-browser-warning = "1" }
