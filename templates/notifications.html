<dialog id="notifications-dialog" aria-labelledby="notifications-title">
<div class="sh-heading"><div><p class="eyebrow">WAREHOUSE UPDATES</p><h2 id="notifications-title">Notifications</h2></div><button id="notifications-close" type="button" aria-label="Close notifications">Close</button></div>
<div class="notification-controls"><button id="notification-sound" type="button" aria-pressed="false">Enable sound</button><button id="notifications-read" type="button">Mark all as read</button></div>
<p class="note" id="notification-sound-note">Sound plays while this app is open. Enable sound to hear new alerts.</p>
<div id="notification-list"></div><p class="note" id="notifications-status" role="status"></p>
</dialog>
<div id="notification-toast" class="hidden" role="status" aria-live="polite"></div>
