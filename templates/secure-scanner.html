<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro • Live barcode scanner</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#25342f;font:16px/1.5 system-ui,Segoe UI,sans-serif;min-height:100dvh;padding:24px 16px;display:flex;justify-content:center}main{width:100%;max-width:660px}small{color:#60776a;letter-spacing:2px}h1{font-size:26px;line-height:1.2;margin:14px 0}p{color:#617267}.preview{position:relative;border:1px solid #d7dfd8;border-radius:14px;overflow:hidden;background:#f5f7f4;aspect-ratio:4/3;margin:24px 0}video{display:block;width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 1px #60776a;pointer-events:none}.guide:after{content:'';position:absolute;left:3%;right:3%;top:50%;border-top:1px solid #38956c}#status{min-height:52px}button{font:inherit;color:#25342f;background:#fff;border:1px solid #d7dfd8;border-radius:8px;width:100%;min-height:48px;padding:12px;cursor:pointer}button:hover{background:#f1f5ef}footer{color:#738276;font-size:12px;margin-top:22px}button:focus-visible{outline:3px solid #1e664f;outline-offset:3px}
</style></head><body><main><small>CENTRO</small><h1>Live barcode scanner</h1><p>Tap <strong>Allow</strong> when Chrome asks for camera access. Hold the barcode inside the guide.</p><div class="preview"><video id="camera" autoplay muted playsinline></video><div class="guide" aria-hidden="true"></div></div><p id="status" role="status">Opening camera…</p><button id="close" type="button">Cancel</button><footer>Your camera is scanned on this device. Images are not uploaded.</footer></main><script src="/decoder.js"></script><script src="/scanner.js"></script></body></html>
